apiVersion: v1
kind: Namespace
metadata:
  name: jailer-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jailer-operator
  namespace: jailer-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jailer-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jailer-operator
subjects:
  - kind: ServiceAccount
    name: jailer-operator
    namespace: jailer-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jailer-operator
  namespace: jailer-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jailer-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jailer-operator
    spec:
      serviceAccountName: jailer-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: jailer-operator:latest
          # The image is built and side-loaded rather than pulled, so Always
          # would fail on a cluster with no registry holding it.
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
          # The manager only resolves policy and writes status. Enforcement is
          # the agent's job, so this holds no host privileges at all.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
